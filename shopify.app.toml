# Configuration for RetentionFlow
name = "RetentionFlow"
handle = "retentionflow"
application_url = "https://tds-followup-app.onrender.com"
embedded = true

[build]
automatically_update_urls_on_dev = true
dev_store_url = "myjrue-ku.myshopify.com"

[access_scopes]
scopes = "read_customers,write_customers,read_orders,read_price_rules,write_price_rules,read_discounts,write_discounts,read_products"

[auth]
redirect_urls = [
  "https://tds-followup-app.onrender.com/auth/callback",
  "https://tds-followup-app.onrender.com/api/auth/callback"
]

[webhooks]
api_version = "2024-01"

[pos]
embedded = false
